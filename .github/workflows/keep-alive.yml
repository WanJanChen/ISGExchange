name: Keep ISGExchange Active

on:
  workflow_dispatch:
  schedule:
    # 台灣時間約上午 09:17。每月 1、4、7……日執行，最長間隔不超過 3 天。
    - cron: "17 1 */3 * *"

permissions:
  contents: read

jobs:
  query-event:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 讀取專案程式
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: 安裝 Python 套件
        run: pip install -r automation/requirements.txt

      - name: 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 登入網站並查詢演出
        working-directory: automation
        env:
          ISG_SITE_URL: https://isgexchange.onrender.com
          ISG_LOGIN_EMAIL: ${{ secrets.ISG_LOGIN_EMAIL }}
          ISG_LOGIN_PASSWORD: ${{ secrets.ISG_LOGIN_PASSWORD }}
          ISG_EVENT_TITLE: ${{ vars.ISG_EVENT_TITLE }}
          ISG_HEADLESS: "true"
        run: python keep_alive.py

      - name: 保存失敗畫面與紀錄
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-debug-${{ github.run_number }}
          path: |
            automation/error-screenshot.png
            automation/logs/keep-alive.log
          if-no-files-found: ignore
          retention-days: 7
